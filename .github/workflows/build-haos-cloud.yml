# 云编译：克隆官方 operating-system（dev）+ 叠加 fork-files/ → 出镜像
#
# 两个构建目标：
#   h618_box        — H618 公版盒子镜像（正式产物）
#   generic_aarch64 — 官方 QEMU/UEFI 机器 + 我们的 overlay（用于 VM 全流程验证：
#                     QEMU 无 H618 仿真，但可验证镜像结构/boot/provision/HA/向导）
#
# 注意：
#  - 官方仓库自带 CI 用自托管 runner，fork 后默认不会跑，所以在自己仓库构建
#  - 托管 runner 磁盘 ~14GB，先清理预装软件；构建可能 2~6 小时，失败重跑（缓存加速）
name: Build HAOS images (cloud)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/haos-h618/fork-files/**"
      - ".github/workflows/build-haos-cloud.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        machine: [h618_box, generic_aarch64]
    steps:
      - name: Checkout (easyha)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          docker image prune -af || true
          df -h /

      - name: Cache downloads & ccache
        uses: actions/cache@v4
        with:
          path: |
            /cache/dl
            /cache/cc
          key: haos-${{ matrix.machine }}-${{ github.run_id }}
          restore-keys: haos-${{ matrix.machine }}- ; haos-h618_box-
          save-always: true

      - name: Clone upstream operating-system
        run: |
          git clone --depth 1 --branch dev --recurse-submodules --shallow-submodules \
            https://github.com/home-assistant/operating-system haos

      - name: Overlay machine files
        working-directory: haos
        run: |
          rsync -a ../build/haos-h618/fork-files/ buildroot-external/
          # provision 服务的启用链接必须在构建期进入 rootfs（Windows 检出不带 symlink，
          # 且 buildroot 自动 enable 不覆盖 overlay 单元 —— VM 验证抓出的缺失项）
          mkdir -p buildroot-external/rootfs-overlay/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/easyha-provision.service \
            buildroot-external/rootfs-overlay/etc/systemd/system/multi-user.target.wants/easyha-provision.service
          echo "=== 机器文件落位校验 ==="
          ls buildroot-external/configs/ | grep h618_box
          test -f buildroot-external/board/allwinner/h618box/meta
          test -f buildroot-external/board/allwinner/h618box/sun50i-h618-easybox.dts
          test -f buildroot-external/rootfs-overlay/usr/sbin/easyha-provision
          test -f buildroot-external/rootfs-overlay/usr/sbin/easyha-portal.py
          test -L buildroot-external/rootfs-overlay/etc/systemd/system/multi-user.target.wants/easyha-provision.service

      - name: Patch buildroot uboot dep (rockchip-blobs → arm-trusted-firmware)
        working-directory: haos
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'buildroot/boot/uboot/uboot.mk'
          s = open(p, encoding='utf-8').read()
          new, n = re.subn(
              r"(BR2_TARGET_UBOOT_NEEDS_ATF_BL31\),y\)\n\t?)UBOOT_DEPENDENCIES \+= rockchip-blobs",
              r"\1UBOOT_DEPENDENCIES += arm-trusted-firmware",
              s, count=1)
          assert n == 1, "uboot.mk 的 rockchip-blobs 依赖未找到——上游结构变了，需要人工复核"
          open(p, 'w', encoding='utf-8').write(new)
          print("uboot.mk 依赖已改接 arm-trusted-firmware")
          PYEOF

      - name: Build ${{ matrix.machine }}
        working-directory: haos
        run: |
          sudo mkdir -p /cache/dl /cache/cc
          sudo chown -R $(id -u):$(id -g) /cache
          docker build -t hassos-builder .
          docker run --rm --privileged \
            -v "$(pwd):/build" -v /cache:/cache hassos-builder \
            bash -c "make ${{ matrix.machine }}"

      - name: Collect images
        if: always()
        run: |
          mkdir -p out
          cp -a haos/output/images/*.img* out/ 2>/dev/null || true
          cp -a haos/output/images/*.raucb out/ 2>/dev/null || true
          ls -la out/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hassos-${{ matrix.machine }}
          path: out/*
          retention-days: 14
          if-no-files-found: warn
