# ============================================================
# EasyHA H618 公版 · SPL/U-Boot 镜像（sunxi）
# 与 vim3 的差异：sunxi BootROM 从介质 **8KB 偏移** 加载 SPL，
# u-boot-sunxi-with-spl.bin 内 SPL 位于文件头，因此把它放在
# spl.img 的 8K 偏移处，磁盘前 8K 留给 MBR（holes 声明）。
# ============================================================

image spl.img {
	size = ${BOOT_SPL_SIZE}

	hdimage {
		partition-table-type = "none"
		fill = "yes"
	}

	partition uboot {
		offset = 8K
		image = "u-boot-sunxi-with-spl.bin"
	}
}
